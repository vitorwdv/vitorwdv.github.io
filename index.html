<script>
	const translations = {
		pt: {
			summary: [
				"Engenheiro eletricista ⚡",
				"Mestre em computação aplicada 💻",
				"Gosto de tecnologia, pizza e câmbio flutuante"
			],
			personal: "Pessoal",
			professional: "Profissional & Acadêmico",
			contact: "Contato",
			location: "São Leopoldo, RS, Brasil"
		},
		en: {
			summary: [
				"Electrical Engineer ⚡",
				"MSc in Applied Computing 💻",
				"I like technology, pizza and floating exchange rates"
			],
			personal: "Personal",
			professional: "Professional & Academic",
			contact: "Contact",
			location: "Sao Leopoldo, RS, Brazil"
		}
	};

	const summary = document.getElementById('summary');
	const translatableNodes = document.querySelectorAll('[data-i18n]');
	const langToggle = document.getElementById('lang-toggle');

	function detectPreferredLanguage() {
		const languages = Array.isArray(navigator.languages) && navigator.languages.length > 0
			? navigator.languages
			: [navigator.language || 'en'];
		return languages.some((language) => /^pt(?:-|$)/i.test(language)) ? 'pt' : 'en';
	}

	function setLanguage(lang) {
		document.documentElement.lang = lang;
		const t = translations[lang];
		summary.innerHTML = t.summary.join('<br>');
		translatableNodes.forEach((node) => {
			node.textContent = t[node.dataset.i18n];
		});
	}

	langToggle.addEventListener('click', () => {
		const nextLang = document.documentElement.lang === 'en' ? 'pt' : 'en';
		setLanguage(nextLang);
	});

	setLanguage(detectPreferredLanguage());
</script>

</html>
